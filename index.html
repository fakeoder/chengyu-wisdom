<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Chengyu Wisdom — classic Chinese idioms as a gateway to traditional Chinese philosophy, mindset and values."
    />
    <meta name="theme-color" content="#a63c2f" />
    <meta name="apple-mobile-web-app-title" content="Chengyu Wisdom" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />

    <title>Chengyu Wisdom — Wisdom in Four Characters</title>
    <script>
      // Apply saved/system theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("chengyu-theme");
          var dark = t
            ? t === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage unavailable — default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
